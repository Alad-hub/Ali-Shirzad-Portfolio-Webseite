<body>
    <center><h2>Tic Tac Toe Spiel</h2></center>
    <div class="gamemap">
    <table>
    <tr>
        <td onclick="switchSpieler(1)"><img id= "spielfeld1"src="img/Leer.png"></td>
        <td onclick="switchSpieler(2)"><img id= "spielfeld2"src="img/Leer.png"></td>
        <td onclick="switchSpieler(3)"><img id= "spielfeld3"src="img/Leer.png"></td>

    </tr>
    <tr>
        <td onclick="switchSpieler(4)"><img id= "spielfeld4"src="img/Leer.png"></td>
        <td onclick="switchSpieler(5)"><img id= "spielfeld5"src="img/Leer.png"></td>
        <td onclick="switchSpieler(6)"><img id= "spielfeld6"src="img/Leer.png"></td>
    </tr>
    <tr>
        <td onclick="switchSpieler(7)"><img id= "spielfeld7"src="img/Leer.png"></td>
        <td onclick="switchSpieler(8)"><img id= "spielfeld8"src="img/Leer.png"></td>
        <td onclick="switchSpieler(9)"><img id= "spielfeld9"src="img/Leer.png"></td>
    </tr>
    </table>
    </div>


    <h3 id="decision">‎</h3>
    
    <class="resetbutton"><center><button type="button" onclick="reset()">Replay</button></center></class>
    
    

     



   
   

    <script>
        let winnerstatus = "none";
        let gamestate= "Running";

          let elements= ["spielfeld1", "spielfeld2", "spielfeld3", "spielfeld4",
            "spielfeld5", "spielfeld6", "spielfeld7", "spielfeld8", "spielfeld9",]

            
        function switchSpieler(zellnr){
            document.getElementById("spielfeld" + zellnr).src= "img/Kreuz.png";
            elements = elements.filter(item => item !== "spielfeld" + zellnr)
            

            var randomcell= elements[Math.floor(Math.random() * elements.length)];
            elements = elements.filter(item => item !== randomcell)
            checkWinner()
            checktie()

            
            if (gamestate == "Running"){
            setTimeout(() => {
                    document.getElementById(randomcell).src= "img/Kreis.png";
                checkWinner()}, 500);
            }

        }
            
          function reset(){
            
            for(var nr =1; nr<=9; nr++){
                document.getElementById("spielfeld"+nr).src = "img/Leer.png";

                document.getElementById("decision").innerHTML= "‎ ";
                gamestate= "Running";
                winnerstatus= "none";
                
                elements= ["spielfeld1", "spielfeld2", "spielfeld3", "spielfeld4",
            "spielfeld5", "spielfeld6", "spielfeld7", "spielfeld8", "spielfeld9",]
            }

        }
        


      function checkWinner() {
    const winCombos = [
        [1,2,3], [4,5,6], [7,8,9], 
        [1,4,7], [2,5,8], [3,6,9], 
        [1,5,9], [3,5,7]           
    ];

    
    

    for (let combo of winCombos) {
        const [a,b,c] = combo.map(i => document.getElementById("spielfeld" + i).src);

        if (a.includes("img/Leer.png") || b.includes("img/Leer.png") || c.includes("img/Leer.png")) continue;

        if (a.includes("img/Kreuz.png") && b.includes("img/Kreuz.png") && c.includes("img/Kreuz.png")) {
            gamestate = "Terminate";
            document.getElementById("decision").innerHTML = "<u><i>Sie haben gewonnen!</i></u>";
            winnerstatus = "won";
            console.log("this is k" + winnerstatus)
        } 

        
        
        if (a.includes("img/Kreis.png") && b.includes("img/Kreis.png") && c.includes("img/Kreis.png")) {
            gamestate = "Terminate";
            document.getElementById("decision").innerHTML = "<u><i>Der Kreis hat gewonnen!</i></u>";
            winnerstatus= "won";
            console.log("this is k" + winnerstatus)
        }

        
       
        
        
       
    }
}
            function checktie(){
         if(elements.length == 0 && winnerstatus=="none"){
            document.getElementById("decision").innerHTML = "<u><i>Tie!</i></u>";
            gamestate = "Terminate";
            console.log(winnerstatus)
                    }
            }
    </script>
