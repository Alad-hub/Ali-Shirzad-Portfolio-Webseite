    <div class="buttons">
    <button class="resetbtn" type="button" onclick="reset()">Reset</button>
    <button class="rotwinbtn" type="button" onclick="rotwin()">Rot gewinnt</button>
    <button class="blauwinbtn" type="button" onclick="blauwin()">Blau gewinnt</button>
    <button class="scorereset" type="button" onclick="resetscore()">Score Zurücksetzen</button>

    <div style="text-align: center; gap: 5px;">
    <h4 style="border:ridge 3px red; display: inline-block; padding: 3px;" id="rotscore">Rot: 0</h4>
    <h4 style="border:ridge 3px blue; display: inline-block; padding: 3px;" id="blauscore">Blau: 0</h4>
    </div>

     <script>
        var win= 0
        function rotwin(){
            win ++;
            document.getElementById("rotscore").innerHTML = ("Rot: " + win);
        }
    
        var win1= 0
        function blauwin(){
            win1 ++;
            document.getElementById("blauscore").innerHTML = ("Blau: " + win1);
        }
    
   
        function resetscore(){
            document.getElementById("rotscore").innerHTML = "Rot: 0";
            document.getElementById("blauscore").innerHTML = "Blau: 0";
        }
    
        function reset(){
            for(var nr =1; nr<=42; nr++){
                document.getElementById("spielfeld"+nr).src = "img/Violet.png";
            }
            


        }

        var Spieler = "True";

        function switchSpieler(zellnr){
           if (Spieler == "True"){
            document.getElementById("spielfeld" + zellnr).src= "img/Rot.png";
            Spieler = "False";
        }
          else{
             document.getElementById("spielfeld" + zellnr).src= "img/Blau.png";
             Spieler = "True";

          }
        }
    </script>
